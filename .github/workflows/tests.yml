name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg dbus libegl1 libgl1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Version numbers agree
        run: |
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          module=$(uv run --no-sync python -c 'import semma; print(semma.__version__)')
          [[ $project == "$module" ]] || { echo "pyproject.toml says $project, semma.__version__ $module"; exit 1; }

      - name: Comment lint
        run: uv run --no-sync python scripts/lint_comments.py

      - name: Tests
        run: dbus-run-session -- uv run --no-sync pytest
