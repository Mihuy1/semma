name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          module=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/semma/__init__.py)
          [[ $module == "$project" ]] || { echo "semma.__version__ is $module, pyproject.toml $project"; exit 1; }
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            [[ $GITHUB_REF_NAME == "v$project" ]] || { echo "tag $GITHUB_REF_NAME, pyproject.toml $project"; exit 1; }
            exit 0
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || { echo "run this workflow from main, not $GITHUB_REF"; exit 1; }
          if gh release view "v$project" > /dev/null 2>&1; then
            echo "v$project is already released: raise the version in pyproject.toml" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$project" > /dev/null; then
            echo "v$project is already on GitHub but not released: re-run its failed Release workflow instead" >&2
            exit 1
          fi

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: v${{ needs.package.outputs.version }}
        run: |
          flags=()
          [[ $VERSION == *-* ]] && flags+=(--prerelease)
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            gh release create "$TAG" dist/* --title "Semma $VERSION" --generate-notes \
              --verify-tag "${flags[@]}"
          else
            gh release create "$TAG" dist/* --title "Semma $VERSION" --generate-notes \
              --target "$GITHUB_SHA" "${flags[@]}"
          fi
