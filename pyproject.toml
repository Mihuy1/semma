[project]
name = "semma"
version = "0.6.1"
description = "Semantic desktop search for KDE KRunner and GNOME Shell, powered by EmbeddingGemma 2 and sqlite-vec"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "charset-normalizer>=3.5.2",
    "dbus-fast>=5",
    "inotify-simple>=2.0.1",
    "numpy>=2",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "pyside6-essentials>=6.12.0",
    "sqlite-vec>=0.1.9",
    "tomlkit>=0.15.2",
]

[project.scripts]
semma = "semma.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
