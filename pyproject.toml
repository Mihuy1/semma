[project]
name = "gemmasearch"
version = "0.1.0"
description = "Semantic desktop search for KDE KRunner, powered by EmbeddingGemma 2 and sqlite-vec"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
gemmasearch = "gemmasearch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemmasearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
