# One description for both packages: scripts/package.sh fills build/stage and the variables, then
# runs `nfpm package` once for the .rpm and once for the .deb.
name: semma
arch: amd64
platform: linux
version: ${SEMMA_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Mihuy1 <Mihuy1@users.noreply.github.com>
license: MIT
homepage: https://github.com/Mihuy1/semma
description: |
  Semantic file search for KDE KRunner and GNOME Shell.
  Finds documents, PDFs, pictures, recordings and videos by what is in them, with
  EmbeddingGemma 2 running on this computer through llama.cpp (Vulkan or CPU).
  The model (865 MB) is downloaded the first time the service runs.

contents:
  - src: build/stage/usr
    dst: /usr
    type: tree
  # Debian looks for a package's licenses in /usr/share/doc/<package>/copyright.
  - src: build/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/semma/copyright
    packager: deb
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
  postremove: packaging/postremove.sh

# The service downloads the model over HTTPS with the carried Python, which verifies it against the
# system's certificates: ca-certificates is a dependency (a bare Ubuntu or Debian has none).
# Python and its libraries are inside the package; the llama.cpp libraries need the C and C++
# runtimes of the image they were built in or newer, and OpenMP. Vulkan, ffmpeg and the desktop
# libraries linked by the bundled Qt Widgets subset (`semma gui` on Wayland and X11) are in
# recommends: a normal desktop install brings them in, while a minimal or headless install with
# --no-install-recommends / install_weak_deps=False keeps the daemon free of the desktop stack.
# Tesseract (the library and English; OCR of screenshots, off by default, loaded with dlopen only
# when on) is a recommend too: Debian's libtesseract5 brings no language data, Fedora's
# tesseract-libs brings English already. Other languages are the distribution's language packs.
overrides:
  deb:
    depends:
      - libc6 (>= ${SEMMA_GLIBC})
      - libstdc++6
      - libgomp1
      - ca-certificates
    recommends:
      - libvulkan1
      - ffmpeg
      - libtesseract5
      - tesseract-ocr-eng
      - libdbus-1-3
      - libegl1
      - libfontconfig1
      - libfreetype6
      - libgl1
      - libglib2.0-0t64
      - libwayland-client0
      - libwayland-cursor0
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
  rpm:
    depends:
      - glibc >= ${SEMMA_GLIBC}
      - libstdc++
      - libgomp
      - ca-certificates
    recommends:
      - vulkan-loader
      - /usr/bin/ffmpeg
      - tesseract-libs
      - tesseract-langpack-eng
      - dbus-libs
      - fontconfig
      - freetype
      - glib2
      - libX11
      - libX11-xcb
      - libglvnd-egl
      - libglvnd-glx
      - libwayland-client
      - libwayland-cursor
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - xcb-util
      - xcb-util-cursor
      - xcb-util-image
      - xcb-util-keysyms
      - xcb-util-renderutil
      - xcb-util-wm

deb:
  compression: xz
rpm:
  compression: zstd
